services:
  api:
    build: .
    container_name: pos-api-multi
    environment:
      DB_MODE: multi
      MASTER_DSN: postgres://postgres:supersecret@${VM2_IP}:5433/pos_master?sslmode=disable
      TENANT_DB_HOST: ${VM2_IP}
      TENANT_DB_PORT: "5433"
      PORT: "8080"
      JWT_SECRET: change-me-in-production
    ports:
      - "8080:8080"
    restart: on-failure
